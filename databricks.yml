# Bundle identification
bundle:
  name: library_bundle

# Additional configuration files
include:
  - targets.yml
  - resources/*.yml

# Custom Bundle variables
variables:
  job_name:
    description: Name of the library processing job
    default: library-loan-processing

# Files excluded from workspace synchronization
sync:
  exclude:
    - .github/
    - tests/
    - requirements-dev.txt
