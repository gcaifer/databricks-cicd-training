# Library loan processing job
resources:
  jobs:
    library_job:
      name: library-loan-processing
      description: "Library loan processing managed by an automated CI/CD promotion pipeline."

      # Job metadata
      tags:
        project: library-training
        environment: ${bundle.target}
        automation_test: "ci-cd"

      tasks:
        - task_key: process_loans
          notebook_task:
            notebook_path: ../notebooks/process_loans.py
