name: Python CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python code
        run: python -m ruff check src tests notebooks

      - name: Run unit tests
        run: python -m pytest -q

  bundle-validation:
    name: Bundle YAML Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install PyYAML check-jsonschema

      - name: Check Bundle YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path("databricks.yml"),
              Path("targets.yml"),
              *sorted(Path("resources").glob("*.yml")),
          ]

          if len(paths) < 3:
              raise ValueError("Bundle resource YAML files not found")

          for path in paths:
              with path.open(encoding="utf-8") as file:
                  data = yaml.safe_load(file)

              if not isinstance(data, dict):
                  raise ValueError(
                      f"{path}: expected a YAML mapping"
                  )

              print(f"OK: {path}")

          print("Bundle YAML syntax checks passed!")
          PY

      - name: Install Databricks CLI
        uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # Pinned installer
        with:
          version: 1.26.0

      - name: Generate Databricks Bundle Schema
        run: |
          databricks bundle schema > "$RUNNER_TEMP/databricks-bundle-schema.json"

      - name: Validate Bundle against JSON Schema
        run: |
          check-jsonschema \
            --schemafile "$RUNNER_TEMP/databricks-bundle-schema.json" \
            databricks.yml \
            targets.yml \
            resources/*.yml

      - name: Validate Bundle target modes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
              Path("targets.yml").read_text(encoding="utf-8")
          )

          allowed_modes = {"development", "production"}

          for target_name, target_config in config["targets"].items():
              mode = target_config.get("mode")

              if mode is not None and mode not in allowed_modes:
                  raise ValueError(
                      f"Invalid mode for target '{target_name}': "
                      f"{mode!r}. Expected: development or production."
                  )

          print("Bundle target modes: OK")
          PY
