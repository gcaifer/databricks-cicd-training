
name: Python CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python code
        run: python -m ruff check src tests notebooks

      - name: Run unit tests
        run: python -m pytest -q

  bundle-validation:
    name: Bundle YAML Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Check Bundle YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path("databricks.yml"),
              Path("targets.yml"),
              *sorted(Path("resources").glob("*.yml")),
          ]

          if len(paths) < 3:
              raise ValueError("Bundle resource YAML files not found")

          for path in paths:
              with path.open(encoding="utf-8") as file:
                  data = yaml.safe_load(file)

              if not isinstance(data, dict):
                  raise ValueError(
                      f"{path}: expected a YAML mapping"
                  )

              print(f"OK: {path}")

          print("Bundle YAML syntax checks passed!")
          PY
