name: Databricks OIDC DEV Test

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: "Apply deployment to DEV?"
        type: boolean
        required: true
        default: false

  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: databricks-deploy-dev
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI for DEV
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify commit SHA
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"

          if [ "$actual_sha" != "$APPROVED_SHA" ]; then
            echo "Checkout does not match CI-approved commit!"
            exit 1
          fi

          echo "CI-approved commit verified: $actual_sha"

  validate-dev:
    name: Validate DEV after CI

    needs: verify-ci

    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        needs.verify-ci.result == 'success'
      }}

    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify approved commit is still main
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [ -z "$current_sha" ]; then
            echo "Could not determine current main SHA"
            exit 1
          fi

          if [ "$current_sha" != "$APPROVED_SHA" ]; then
            echo "A newer commit exists on main. Deployment blocked."
            echo "Approved: $APPROVED_SHA"
            echo "Current:  $current_sha"
            exit 1
          fi

          echo "Approved commit is current main: $APPROVED_SHA"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # Pinned installer
        with:
          version: 1.26.0

      - name: Verify authenticated identity
        run: databricks current-user me

      - name: Validate Bundle DEV
        run: databricks bundle validate -t dev

      - name: Verify existing Job binding
        run: |
          set -euo pipefail

          databricks bundle summary -t dev | tee bundle-summary.txt
          grep -q '/jobs/877967220525868' bundle-summary.txt

      - name: Plan Bundle DEV
        run: |
          set -euo pipefail

          databricks bundle plan -t dev | tee bundle-plan.txt

          if grep -Eq '^(create|delete) jobs\.library_job$' bundle-plan.txt; then
            echo "Unexpected Job creation or deletion!"
            exit 1
          fi

      - name: Deploy Bundle to DEV
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          checkout_sha="$(git rev-parse HEAD)"
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [ "$checkout_sha" != "$APPROVED_SHA" ] ||
             [ "$current_sha" != "$APPROVED_SHA" ]; then
            echo "Deployment blocked: commit is not current main"
            echo "Approved: $APPROVED_SHA"
            echo "Checkout: $checkout_sha"
            echo "Current:  $current_sha"
            exit 1
          fi

          echo "Commit verified immediately before deployment"
          databricks bundle deploy -t dev

      - name: Verify deployed Job
        run: |
          set -euo pipefail

          databricks bundle summary -t dev | tee bundle-summary.txt
          grep -q '/jobs/877967220525868' bundle-summary.txt

          databricks jobs get 877967220525868 -o json |
            jq -e '.job_id == 877967220525868'

          echo "Existing DEV Job verified successfully"

      - name: Generate DEV deployment evidence
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          checkout_sha="$(git rev-parse HEAD)"

          if [ "$checkout_sha" != "$APPROVED_SHA" ]; then
            echo "Deployment evidence SHA mismatch!"
            exit 1
          fi

          jq -n \
            --arg environment "dev" \
            --arg commit_sha "$APPROVED_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployment_status "success" \
            --argjson databricks_job_id 877967220525868 \
            '{
              environment: $environment,
              commit_sha: $commit_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              deployment_status: $deployment_status,
              databricks_job_id: $databricks_job_id
            }' > dev-deployment.json

          jq -e \
            '.environment == "dev" and
             .deployment_status == "success" and
             (.commit_sha | length == 40)' \
            dev-deployment.json

          echo "DEV deployment evidence generated successfully"

      - name: Upload DEV deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-deployment-evidence
          path: dev-deployment.json
          if-no-files-found: error
          retention-days: 30

  test-oidc:
    name: Validate and Deploy DEV

    if: ${{ github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # Pinned installer
        with:
          version: 1.26.0

      - name: Verify authenticated identity
        run: databricks current-user me

      - name: Validate Bundle
        run: databricks bundle validate -t dev

      - name: Verify existing Job binding
        run: |
          databricks bundle summary -t dev | tee bundle-summary.txt
          grep -q '/jobs/877967220525868' bundle-summary.txt

      - name: Plan Bundle
        run: |
          set -o pipefail
          databricks bundle plan -t dev | tee bundle-plan.txt

          if grep -Eq '^(create|delete) jobs\.library_job$' bundle-plan.txt; then
            echo "Unexpected Job creation or deletion!"
            exit 1
          fi

      - name: Deploy Bundle to DEV
        if: ${{ inputs.deploy_dev }}
        run: databricks bundle deploy -t dev

      - name: Verify deployed Job
        if: ${{ inputs.deploy_dev }}
        run: |
          databricks bundle summary -t dev
          databricks jobs get 877967220525868 -o json |
            jq '{
              job_id,
              creator_user_name,
              run_as_user_name,
              name: .settings.name,
              notebook: .settings.tasks[0].notebook_task.notebook_path,
              deployment: .settings.deployment
            }'
