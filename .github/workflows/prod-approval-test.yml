name: PROD Approval Gate Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  approval-test:
    name: Verify PROD OIDC

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      id-token: write

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm approval
        run: |
          echo "PROD environment approval confirmed"
          echo "Git reference: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"

      - name: Verify PROD workspace
        run: |
          if [ "$DATABRICKS_HOST" != "https://dbc-bfd5635e-3885.cloud.databricks.com" ]; then
            echo "Incorrect PROD workspace!"
            exit 1
          fi

          echo "PROD workspace verified"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify authenticated identity
        run: databricks current-user me -t prod

      - name: Validate Bundle PROD
        run: |
          set -euo pipefail

          databricks bundle validate -t prod

          echo "PROD Bundle validation completed successfully"
