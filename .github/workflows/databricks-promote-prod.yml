name: Promote DEV to PROD

on:
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: "Successful DEV deployment workflow run ID"
        required: true
        type: string

      candidate_sha:
        description: "Commit SHA to promote to PROD"
        required: true
        type: string

permissions: {}

jobs:
  verify-dev:
    name: Verify DEV deployment eligibility

    runs-on: ubuntu-latest

    outputs:
      approved_sha: ${{ steps.validate-evidence.outputs.approved_sha }}
      dev_run_attempt: ${{ steps.verify-run.outputs.run_attempt }}
      artifact_id: ${{ steps.locate-evidence.outputs.artifact_id }}
      artifact_digest: ${{ steps.locate-evidence.outputs.artifact_digest }}

    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate promotion inputs
        env:
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}

        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Promotion must originate from main"
            exit 1
          fi

          if [[ ! "$DEV_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid DEV workflow run ID"
            exit 1
          fi

          if [[ ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid candidate commit SHA"
            exit 1
          fi

          if [ "$CANDIDATE_SHA" != "$GITHUB_SHA" ]; then
            echo "Candidate SHA does not match workflow SHA"
            exit 1
          fi

          echo "Promotion inputs validated successfully"
          echo "DEV Run ID: $DEV_RUN_ID"
          echo "Candidate SHA: $CANDIDATE_SHA"

      - name: Verify DEV workflow run
        id: verify-run

        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}

        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID" \
            > dev-run.json

          if ! jq -e \
            --arg run_id "$DEV_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            '
              (.id | tostring) == $run_id and
              .workflow_id == 424563001 and
              .path == ".github/workflows/databricks-oidc-dev.yml" and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              .event == "workflow_run" and
              .head_branch == "main" and
              .status == "completed" and
              .conclusion == "success"
            ' dev-run.json > /dev/null; then

            echo "DEV workflow run is not eligible for promotion"
            exit 1
          fi

          run_attempt="$(jq -er '.run_attempt' dev-run.json)"

          if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid DEV workflow run attempt"
            exit 1
          fi

          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

          echo "DEV workflow run verified successfully"
          echo "DEV Run ID: $DEV_RUN_ID"
          echo "DEV Run attempt: $run_attempt"

      - name: Verify DEV deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
          DEV_RUN_ATTEMPT: ${{ steps.verify-run.outputs.run_attempt }}

        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID/attempts/$DEV_RUN_ATTEMPT/jobs?per_page=100" \
            > dev-jobs-pages.json

          jq '[.[].jobs[]]' dev-jobs-pages.json > dev-jobs.json

          if ! jq -e '
            def successful_job($name):
              [.[] | select(.name == $name)] |
              length == 1 and
              .[0].status == "completed" and
              .[0].conclusion == "success";

            successful_job("Verify CI for DEV") and
            successful_job("Validate DEV after CI")
          ' dev-jobs.json > /dev/null; then

            echo "Required DEV jobs did not complete successfully"
            exit 1
          fi

          echo "Required DEV jobs verified successfully"

      - name: Verify DEV deployment steps
        shell: bash
        run: |
          set -euo pipefail

          if ! jq -e '
            def successful_step($name):
              [.steps[] | select(.name == $name)] |
              length == 1 and
              .[0].status == "completed" and
              .[0].conclusion == "success";

            .[] |
            select(.name == "Validate DEV after CI") |

            successful_step("Checkout CI-approved commit") and
            successful_step("Verify approved commit is still main") and
            successful_step("Validate Bundle DEV") and
            successful_step("Verify existing Job binding") and
            successful_step("Plan Bundle DEV") and
            successful_step("Deploy Bundle to DEV") and
            successful_step("Verify deployed Job") and
            successful_step("Generate DEV deployment evidence") and
            successful_step("Upload DEV deployment evidence")
          ' dev-jobs.json > /dev/null; then

            echo "Required DEV deployment steps did not complete successfully"
            exit 1
          fi

          echo "Required DEV deployment steps verified successfully"

      - name: Locate DEV deployment evidence
        id: locate-evidence

        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}

        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID/artifacts?per_page=100" \
            > dev-artifacts-pages.json

          jq '
            [.[].artifacts[] |
              select(.name == "dev-deployment-evidence")]
          ' dev-artifacts-pages.json > dev-artifacts.json

          if ! jq -e '
            length == 1 and
            .[0].expired == false and
            .[0].size_in_bytes > 0 and
            (.[0].digest | test("^sha256:[a-f0-9]{64}$"))
          ' dev-artifacts.json > /dev/null; then

            echo "Invalid or unavailable DEV deployment evidence"
            exit 1
          fi

          artifact_id="$(jq -er '.[0].id' dev-artifacts.json)"
          artifact_digest="$(jq -er '.[0].digest' dev-artifacts.json)"

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

          echo "DEV deployment evidence located successfully"
          echo "Artifact ID: $artifact_id"
          echo "Artifact digest: $artifact_digest"

      - name: Download and verify DEV deployment evidence

        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.locate-evidence.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ steps.locate-evidence.outputs.artifact_digest }}

        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output dev-deployment-evidence.zip

          actual_hash="$(sha256sum dev-deployment-evidence.zip | cut -d' ' -f1)"
          actual_digest="sha256:$actual_hash"

          echo "Expected digest: $EXPECTED_DIGEST"
          echo "Actual digest:   $actual_digest"

          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "DEV deployment evidence integrity check failed"
            exit 1
          fi

          echo "DEV deployment evidence downloaded and verified successfully"

      - name: Validate DEV deployment evidence
        id: validate-evidence

        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
          DEV_RUN_ATTEMPT: ${{ steps.verify-run.outputs.run_attempt }}

        shell: bash
        run: |
          set -euo pipefail

          archive_contents="$(unzip -Z1 dev-deployment-evidence.zip)"

          if [ "$archive_contents" != "dev-deployment.json" ]; then
            echo "Unexpected deployment evidence archive contents"
            exit 1
          fi

          unzip -p dev-deployment-evidence.zip \
            dev-deployment.json > dev-deployment.json

          if ! jq -e -s \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg run_id "$DEV_RUN_ID" \
            --arg run_attempt "$DEV_RUN_ATTEMPT" \
            '
              length == 1 and
              (.[0] |
                type == "object" and
                .environment == "dev" and
                .commit_sha == $candidate_sha and
                .run_id == $run_id and
                .run_attempt == $run_attempt and
                .deployment_status == "success" and
                .databricks_job_id == 877967220525868
              )
            ' dev-deployment.json > /dev/null; then

            echo "DEV deployment evidence validation failed"
            exit 1
          fi

          approved_sha="$(jq -er '.commit_sha' dev-deployment.json)"

          echo "approved_sha=$approved_sha" >> "$GITHUB_OUTPUT"

          echo "DEV deployment evidence validated successfully"
          echo "Approved SHA: $approved_sha"

  deploy-prod:
    name: Deploy Bundle to PROD

    needs: verify-dev

    runs-on: ubuntu-latest
    environment: prod

    concurrency:
      group: databricks-deploy-prod
      cancel-in-progress: false

    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      APPROVED_SHA: ${{ needs.verify-dev.outputs.approved_sha }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      PROD_DEPLOYMENT_PHASE: maintenance
      EXPECTED_PROD_JOB_ID: "218012131264427"

    steps:
      - name: Verify approved SHA
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid approved SHA"
            exit 1
          fi

          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "Approved SHA does not match workflow SHA"
            exit 1
          fi

          echo "Approved SHA received: $APPROVED_SHA"

      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-dev.outputs.approved_sha }}
          persist-credentials: false

      - name: Verify approved commit is still main
        shell: bash
        run: |
          set -euo pipefail

          checkout_sha="$(git rev-parse HEAD)"
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          echo "Approved SHA: $APPROVED_SHA"
          echo "Checkout SHA: $checkout_sha"
          echo "Current main: $current_sha"

          if [ "$checkout_sha" != "$APPROVED_SHA" ] ||
             [ "$current_sha" != "$APPROVED_SHA" ]; then

            echo "PROD promotion blocked: SHA mismatch"
            exit 1
          fi

          echo "Approved PROD commit verified successfully"

      - name: Revalidate DEV deployment evidence

        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.verify-dev.outputs.dev_run_attempt }}
          ARTIFACT_ID: ${{ needs.verify-dev.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.verify-dev.outputs.artifact_digest }}

        shell: bash
        run: |
          set -euo pipefail

          run_file="$RUNNER_TEMP/dev-run-revalidation.json"
          artifact_file="$RUNNER_TEMP/dev-artifact-revalidation.json"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID" \
            > "$run_file"

          if ! jq -e \
            --arg run_id "$DEV_RUN_ID" \
            --arg run_attempt "$EXPECTED_RUN_ATTEMPT" \
            '
              (.id | tostring) == $run_id and
              (.run_attempt | tostring) == $run_attempt and
              .status == "completed" and
              .conclusion == "success"
            ' "$run_file" > /dev/null; then

            echo "DEV workflow run is no longer eligible"
            exit 1
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$artifact_file"

          if ! jq -e \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg run_id "$DEV_RUN_ID" \
            --arg digest "$EXPECTED_DIGEST" \
            '
              (.id | tostring) == $artifact_id and
              (.workflow_run.id | tostring) == $run_id and
              .name == "dev-deployment-evidence" and
              .expired == false and
              .size_in_bytes > 0 and
              .digest == $digest
            ' "$artifact_file" > /dev/null; then

            echo "DEV deployment evidence is no longer valid"
            exit 1
          fi

          echo "DEV deployment evidence revalidated successfully"

      - name: Verify PROD authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DATABRICKS_HOST" != "https://dbc-bfd5635e-3885.cloud.databricks.com" ]; then
            echo "Incorrect PROD workspace!"
            exit 1
          fi

          if [ "$DATABRICKS_CLIENT_ID" != "955ab031-e401-40f1-84a4-aa24ea11d66a" ]; then
            echo "Incorrect PROD Service Principal!"
            exit 1
          fi

          echo "PROD authentication configuration verified"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # Pinned installer
        with:
          version: 1.26.0

      - name: Verify authenticated PROD identity
        shell: bash
        run: |
          set -euo pipefail

          identity_file="$RUNNER_TEMP/prod-identity.json"

          databricks current-user me -t prod -o json \
            > "$identity_file"

          if ! jq -e '
            .active == true and
            .displayName == "sp-library-cicd-prod"
          ' "$identity_file" > /dev/null; then

            echo "Unexpected PROD authenticated identity!"
            exit 1
          fi

          echo "PROD Service Principal authenticated successfully"

      - name: Validate Bundle PROD
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle validate -t prod

          echo "PROD Bundle validation completed successfully"

      - name: Inspect PROD Bundle state
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle summary -t prod |
            tee "$RUNNER_TEMP/prod-bundle-summary.txt"

      - name: Plan Bundle PROD
        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/prod-bundle-plan.json"

          databricks bundle plan -t prod -o json \
            > "$plan_file"

          jq -e '
            {
              plan_version,
              operations: (.plan | map_values(.action))
            }
          ' "$plan_file"

          echo "PROD Bundle planning completed successfully"

      - name: Verify PROD deployment plan
        id: verify-prod-plan

        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/prod-bundle-plan.json"

          if ! jq -e -s \
            --arg phase "$PROD_DEPLOYMENT_PHASE" \
            '
              length == 1 and
              (.[0] |
                .plan_version == 2 and
                (.plan |
                  type == "object" and
                  keys == ["resources.jobs.library_job"] and
                  (
                    .["resources.jobs.library_job"].action as $action |
                    if $phase == "bootstrap" then
                      $action == "create"
                    elif $phase == "maintenance" then
                      ($action == "update" or $action == "skip")
                    else
                      false
                    end
                  )
                )
              )
            ' "$plan_file" > /dev/null; then

            echo "Unexpected PROD deployment plan!"
            exit 1
          fi

          echo "PROD deployment plan verified successfully"
          echo "Deployment phase: $PROD_DEPLOYMENT_PHASE"

          plan_digest="$(sha256sum "$plan_file" | cut -d ' ' -f 1)"

          if [[ ! "$plan_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid PROD deployment plan digest!"
            exit 1
          fi

          echo "Authorized plan SHA-256: $plan_digest"

          echo "plan_digest=$plan_digest" >> "$GITHUB_OUTPUT"

      - name: Verify existing PROD Job and Bundle binding
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PROD_DEPLOYMENT_PHASE" != "maintenance" ]; then
            echo "Unexpected PROD deployment phase!"
            exit 1
          fi

          expected_job_name="library-loan-processing"

          jobs_file="$RUNNER_TEMP/prod-existing-jobs.json"
          summary_file="$RUNNER_TEMP/prod-existing-summary.json"

          databricks jobs list \
            --name "$expected_job_name" \
            -t prod \
            -o json \
            > "$jobs_file"

          if ! jq -e -s \
            --arg job_id "$EXPECTED_PROD_JOB_ID" \
            '
              length == 1 and
              (.[0] |
                type == "array" and
                length == 1 and
                (.[0].job_id | tostring) == $job_id
              )
            ' "$jobs_file" > /dev/null; then

            echo "Unexpected or conflicting PROD Jobs!"
            exit 1
          fi

          databricks bundle summary \
            -t prod \
            --force-pull \
            -o json \
            > "$summary_file"

          if ! jq -e \
            --arg job_id "$EXPECTED_PROD_JOB_ID" \
            '
              (.resources.jobs.library_job.id | tostring)
              == $job_id
            ' "$summary_file" > /dev/null; then

            echo "Unexpected existing PROD Bundle binding!"
            exit 1
          fi

          echo "Existing PROD Job verified successfully"
          echo "Existing PROD Bundle binding verified successfully"
          echo "Expected PROD Job ID: $EXPECTED_PROD_JOB_ID"

      - name: Verify authorized PROD plan integrity
        env:
          EXPECTED_PLAN_DIGEST: ${{ steps.verify-prod-plan.outputs.plan_digest }}

        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/prod-bundle-plan.json"

          if [ ! -s "$plan_file" ]; then
            echo "PROD deployment plan is missing or empty!"
            exit 1
          fi

          if [[ ! "$EXPECTED_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid authorized PROD plan digest!"
            exit 1
          fi

          actual_plan_digest="$(
            sha256sum "$plan_file" | cut -d ' ' -f 1
          )"

          echo "Expected plan digest: $EXPECTED_PLAN_DIGEST"
          echo "Actual plan digest:   $actual_plan_digest"

          if [ "$actual_plan_digest" != "$EXPECTED_PLAN_DIGEST" ]; then
            echo "PROD deployment blocked: plan integrity mismatch!"
            exit 1
          fi

          echo "Authorized PROD plan integrity verified successfully"

      - name: Final verification of approved PROD commit
        shell: bash
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"

          current_main_sha="$(
            git ls-remote origin refs/heads/main | cut -f1
          )"

          echo "Approved SHA:     $APPROVED_SHA"
          echo "Checked-out SHA:  $checked_out_sha"
          echo "Workflow SHA:     $GITHUB_SHA"
          echo "Current main SHA: $current_main_sha"

          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid approved SHA!"
            exit 1
          fi

          if [ "$checked_out_sha" != "$APPROVED_SHA" ] ||
             [ "$GITHUB_SHA" != "$APPROVED_SHA" ] ||
             [ "$current_main_sha" != "$APPROVED_SHA" ]; then

            echo "PROD deployment blocked: final SHA mismatch!"
            exit 1
          fi

          echo "Final PROD commit verification completed successfully"

      - name: Deploy Bundle PROD
        env:
          EXPECTED_PLAN_DIGEST: ${{ steps.verify-prod-plan.outputs.plan_digest }}

        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/prod-bundle-plan.json"

          if [ ! -s "$plan_file" ]; then
            echo "Authorized PROD deployment plan is missing or empty!"
            exit 1
          fi

          if [[ ! "$EXPECTED_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid authorized PROD plan digest!"
            exit 1
          fi

          actual_plan_digest="$(
            sha256sum "$plan_file" | cut -d ' ' -f 1
          )"

          if [ "$actual_plan_digest" != "$EXPECTED_PLAN_DIGEST" ]; then
            echo "PROD deployment blocked: plan integrity mismatch!"
            exit 1
          fi

          echo "Deploying approved commit: $APPROVED_SHA"
          echo "Deployment phase: $PROD_DEPLOYMENT_PHASE"
          echo "Authorized plan digest: $actual_plan_digest"

          databricks bundle deploy \
            -t prod \
            --plan "$plan_file" \
            --auto-approve

          echo "PROD Bundle deployment completed successfully"

      - name: Verify deployed PROD Bundle binding
        shell: bash
        run: |
          set -euo pipefail

          summary_file="$RUNNER_TEMP/prod-deployed-summary.json"

          databricks bundle summary \
            -t prod \
            --force-pull \
            -o json \
            > "$summary_file"

          if ! jq -e \
            --arg job_id "$EXPECTED_PROD_JOB_ID" \
            '
              (.resources.jobs.library_job.id | tostring)
              == $job_id
            ' "$summary_file" > /dev/null; then

            echo "Unexpected PROD Bundle Job binding!"
            exit 1
          fi

          echo "PROD Bundle binding verified successfully"
          echo "Deployed PROD Job ID: $EXPECTED_PROD_JOB_ID"

      - name: Verify deployed PROD Job configuration
        id: verify-prod-job
        shell: bash
        run: |
          set -euo pipefail

          job_file="$RUNNER_TEMP/prod-deployed-job.json"

          databricks jobs get \
            "$EXPECTED_PROD_JOB_ID" \
            -t prod \
            -o json \
            > "$job_file"

          if ! jq -e \
            --arg job_id "$EXPECTED_PROD_JOB_ID" \
            --arg principal "$DATABRICKS_CLIENT_ID" \
            '
              (.job_id | tostring) == $job_id and
              .settings.name == "library-loan-processing" and
              .run_as_user_name == $principal and
              (.settings.tasks | length) == 1 and
              .settings.tasks[0].task_key == "process_loans" and
              (.settings.tasks[0].notebook_task | type) == "object"
            ' "$job_file" > /dev/null; then

            echo "Unexpected PROD Job configuration!"
            exit 1
          fi

          echo "PROD Job configuration verified successfully"

          echo "job_id=$EXPECTED_PROD_JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Verify deployed PROD Job ownership
        shell: bash
        run: |
          set -euo pipefail

          permissions_file="$RUNNER_TEMP/prod-job-permissions.json"

          databricks jobs get-permissions \
            "$EXPECTED_PROD_JOB_ID" \
            -t prod \
            -o json \
            > "$permissions_file"

          if ! jq -e \
            --arg principal "$DATABRICKS_CLIENT_ID" \
            '
              any(
                .access_control_list[]?;
                .service_principal_name == $principal and
                any(
                  .all_permissions[]?;
                  .permission_level == "IS_OWNER"
                )
              )
            ' "$permissions_file" > /dev/null; then

            echo "Unexpected PROD Job owner!"
            exit 1
          fi

          echo "PROD Job ownership verified successfully"

      - name: Generate PROD deployment evidence
        env:
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
          DEV_RUN_ATTEMPT: ${{ needs.verify-dev.outputs.dev_run_attempt }}
          DEV_ARTIFACT_ID: ${{ needs.verify-dev.outputs.artifact_id }}
          DEV_ARTIFACT_DIGEST: ${{ needs.verify-dev.outputs.artifact_digest }}
          PLAN_DIGEST: ${{ steps.verify-prod-plan.outputs.plan_digest }}
          VERIFIED_PROD_JOB_ID: ${{ steps.verify-prod-job.outputs.job_id }}

        shell: bash
        run: |
          set -euo pipefail

          evidence_file="$RUNNER_TEMP/prod-deployment.json"

          checked_out_sha="$(git rev-parse HEAD)"

          if [ "$checked_out_sha" != "$APPROVED_SHA" ]; then
            echo "Unexpected deployed commit SHA!"
            exit 1
          fi

          if [ "$VERIFIED_PROD_JOB_ID" != "$EXPECTED_PROD_JOB_ID" ]; then
            echo "Unexpected verified PROD Job ID!"
            exit 1
          fi

          jq -n \
            --arg environment "prod" \
            --arg commit_sha "$APPROVED_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg dev_run_id "$DEV_RUN_ID" \
            --arg dev_run_attempt "$DEV_RUN_ATTEMPT" \
            --arg dev_artifact_id "$DEV_ARTIFACT_ID" \
            --arg dev_artifact_digest "$DEV_ARTIFACT_DIGEST" \
            --arg deployment_phase "$PROD_DEPLOYMENT_PHASE" \
            --arg deployment_status "success" \
            --arg plan_digest "$PLAN_DIGEST" \
            --argjson databricks_job_id "$VERIFIED_PROD_JOB_ID" \
            '{
              environment: $environment,
              commit_sha: $commit_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              dev_run_id: $dev_run_id,
              dev_run_attempt: $dev_run_attempt,
              dev_artifact_id: $dev_artifact_id,
              dev_artifact_digest: $dev_artifact_digest,
              deployment_phase: $deployment_phase,
              deployment_status: $deployment_status,
              plan_digest: $plan_digest,
              databricks_job_id: $databricks_job_id
            }' > "$evidence_file"

          if ! jq -e '
            .environment == "prod" and
            (.commit_sha | test("^[0-9a-f]{40}$")) and
            (.run_id | test("^[1-9][0-9]*$")) and
            (.run_attempt | test("^[1-9][0-9]*$")) and
            (.dev_run_id | test("^[1-9][0-9]*$")) and
            (.dev_run_attempt | test("^[1-9][0-9]*$")) and
            (.dev_artifact_id | test("^[1-9][0-9]*$")) and
            (.dev_artifact_digest | test("^sha256:[0-9a-f]{64}$")) and
            (
              .deployment_phase == "bootstrap" or
              .deployment_phase == "maintenance"
            ) and
            .deployment_status == "success" and
            (.plan_digest | test("^[0-9a-f]{64}$")) and
            (.databricks_job_id | type == "number" and . > 0)
          ' "$evidence_file" > /dev/null; then

            echo "Invalid PROD deployment evidence!"
            exit 1
          fi

          echo "PROD deployment evidence generated successfully"

          cat "$evidence_file"

      - name: Upload PROD deployment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-deployment-evidence
          path: ${{ runner.temp }}/prod-deployment.json
          if-no-files-found: error
          retention-days: 30
